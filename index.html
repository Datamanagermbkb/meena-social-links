<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meena Bazaar Social Links</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  min-height:100vh;
  overflow:hidden;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

#bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:-1;
}

.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo{
  width:180px;
  height:auto;
  margin-bottom:10px;
}

h1{
  color:#fff;
  margin-bottom:25px;
}

.social-links{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.social-links a{
  text-decoration:none;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:18px;
  width:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-weight:500;
  letter-spacing:1px;
  transition:0.3s ease-in-out;
}

.social-links a img{
  width:24px;
  height:24px;
}

.Website{
  background:#ff3399;
}

.youtube{
  background:#FF0000;
}

.facebook{
  background:#3b5998;
}

.instagram{
  background:#E1306C;
}

.whatsapp-customer{
  background:#128C7E;
}

.social-links a:hover{
  box-shadow:
    0 0 10px #ffee02,
    0 0 20px #ff2727,
    0 0 30px #0effcb,
    0 0 40px currentColor,
    0 0 70px currentColor;
  transform:scale(1.05);
  opacity:0.95;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="https://raw.githubusercontent.com/Datamanagermbkb/video-hosting/main/muss.mp4" type="video/mp4">
</video>

<div class="container">

  <img src="https://www.amanoramall.com/assets/images/brand/wr3jvWWCeYiL8xAwYx3XfJIG4gstAY.jpg" alt="Meena Bazaar Logo" class="logo">

  <h1>Connect with Meena Bazaar</h1>

  <div class="social-links">

    <a href="https://api.whatsapp.com/send?phone=917303888641&text=Hi+I+have+a+query.+Can+you+help%3F"
       class="whatsapp-customer"
       target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
      WhatsApp - Customer Care
    </a>

    <a href="https://meenabazaar.com/"
       class="Website"
       target="_blank">
      <img src="https://www.amanoramall.com/assets/images/brand/wr3jvWWCeYiL8xAwYx3XfJIG4gstAY.jpg">
      Website
    </a>

    <a href="https://www.instagram.com/meenabazaar/"
       class="instagram"
       target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
      Instagram
    </a>

    <a href="https://www.youtube.com/channel/UCxuqspu5N8CZThWFc8xa9ig"
       class="youtube"
       target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
      YouTube
    </a>

    <a href="https://www.facebook.com/MeenaBazaar/"
       class="facebook"
       target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/145/145802.png">
      Facebook
    </a>

  </div>

</div>

</body>
</html>
