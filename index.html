<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meena Bazaar Social Links</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100dvh;
    overflow:hidden;
    position:relative;
}

/* VIDEO BACKGROUND */
#bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:-1;
}

/* CENTER CONTENT */
.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    
    width:100%;
    max-width:420px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:15px;
}

.logo{
    width:160px;
    height:auto;
    margin-bottom:12px;
}

h1{
    color:#fff;
    font-size:28px;
    font-weight:700;
    margin-bottom:22px;
    text-shadow:0 2px 5px rgba(0,0,0,.4);
}

/* LINKS */
.social-links{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    width:100%;
}

.social-links a{
    text-decoration:none;
    color:white;
    padding:14px 20px;
    border-radius:14px;

    width:240px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    font-size:18px;
    font-weight:600;

    transition:.3s ease;
}

.social-links a img{
    width:24px;
    height:24px;
}

/* BUTTON COLORS */
.whatsapp-customer{
    background:#128C7E;
}

.Website{
    background:#ff3399;
}

.instagram{
    background:#E1306C;
}

.youtube{
    background:#FF0000;
}

.facebook{
    background:#3b5998;
}

/* HOVER */
.social-links a:hover{
    transform:scale(1.05);
    box-shadow:
      0 0 10px #ffee02,
      0 0 20px #ff2727,
      0 0 30px #0effcb,
      0 0 40px currentColor;
}

/* MOBILE */
@media (max-width:480px){

    .container{
        width:100%;
        max-width:100%;
        padding:12px;
    }

    .logo{
        width:140px;
    }

    h1{
        font-size:24px;
        margin-bottom:18px;
    }

    .social-links{
        gap:12px;
    }

    .social-links a{
        width:260px;
        padding:13px 18px;
        font-size:17px;
    }
}

</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="https://raw.githubusercontent.com/Datamanagermbkb/video-hosting/main/muss.mp4" type="video/mp4">
</video>

<div class="container">

    <img src="https://www.amanoramall.com/assets/images/brand/wr3jvWWCeYiL8xAwYx3XfJIG4gstAY.jpg"
         alt="Meena Bazaar Logo"
         class="logo">

    <h1>Connect with Meena Bazaar</h1>

    <div class="social-links">

        <a href="https://api.whatsapp.com/send?phone=917303888641&text=Hi+I+have+a+query.+Can+you+help%3F"
           class="whatsapp-customer"
           target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
            WhatsApp - Customer Care
        </a>

        <a href="https://meenabazaar.com/"
           class="Website"
           target="_blank">
            <img src="https://www.amanoramall.com/assets/images/brand/wr3jvWWCeYiL8xAwYx3XfJIG4gstAY.jpg">
            Website
        </a>

        <a href="https://www.instagram.com/meenabazaar/"
           class="instagram"
           target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
            Instagram
        </a>

        <a href="https://www.youtube.com/channel/UCxuqspu5N8CZThWFc8xa9ig"
           class="youtube"
           target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
            YouTube
        </a>

        <a href="https://www.facebook.com/MeenaBazaar/"
           class="facebook"
           target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/145/145802.png">
            Facebook
        </a>

    </div>

</div>

</body>
</html>
